[package]
name = "sseq_mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing minimal resolutions over the Steenrod algebra to SageMath"

[dependencies]
algebra = { path = "../../ext/crates/algebra", default-features = false }
ext = { path = "../../ext", default-features = false }
fp = { path = "../../ext/crates/fp", default-features = false }
sseq = { path = "../../ext/crates/sseq", default-features = false }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[features]
default = ["odd-primes", "concurrent"]
odd-primes = ["ext/odd-primes"]
concurrent = ["ext/concurrent"]

[dev-dependencies]
rstest = "0.25"
